<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Відмови постачальників</title>
<style>
body{font:14px system-ui,sans-serif;width:700px;margin:0;padding:14px;color:#222}
h1{font-size:18px;margin:0 0 8px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.stats{font-weight:600}.muted{color:#777}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid #ddd}th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:right}
.actions{margin-top:12px;display:flex;gap:8px}button{padding:7px 12px;cursor:pointer}
#status{margin-top:8px;min-height:18px}.empty{padding:18px 0;color:#777}
</style>
</head>
<body>
<div class="bar"><h1>Відмови постачальників</h1><div id="stats" class="stats"></div></div>
<table><thead><tr><th>Назва</th><th>Код Моріона</th><th>К-сть відмовлено</th></tr></thead><tbody id="rows"></tbody></table>
<div class="actions">
<button id="scan">Перевірити зараз</button><button id="copy">Скопіювати</button><button id="clear">Очистити</button>
</div>
<div id="status" class="muted"></div>
<script src="popup.js"></script>
</body>
</html>
