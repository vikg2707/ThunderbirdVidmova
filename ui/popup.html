<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Відмови постачальників</title><style>
body{font:14px system-ui,sans-serif;width:850px;margin:0;padding:14px;color:#222}.bar{display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0 0 10px}.tabs{display:flex;gap:6px;margin-bottom:10px}button{padding:7px 11px;cursor:pointer}.tab.active{font-weight:700}.stats{font-weight:600}.muted{color:#777}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid #ddd;text-align:left}th.num,td.num{text-align:right}.actions{margin-top:12px;display:flex;gap:8px}#status{margin-top:8px;min-height:18px}.empty{padding:18px 0;color:#777}.danger{font-weight:600}
</style></head><body><div class="bar"><h1>Thunderbird Vidmova</h1><div id="stats" class="stats"></div></div>
<div class="tabs"><button class="tab active" data-tab="refusals">Відмови</button><button class="tab" data-tab="orders">Замовлення</button><button class="tab" data-tab="unmatched">Невпізнані</button><button class="tab" data-tab="suppliers">Постачальники</button></div>
<div id="content"></div><div class="actions"><button id="scan">Перевірити зараз</button><button id="copy">Скопіювати відмови (Excel)</button><button id="export">Експорт CSV</button><button id="clear">Очистити відмови</button></div><div id="status" class="muted"></div>
<script src="popup.js"></script></body></html>
